<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дигитална лаборатория – тест</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;color:#203047;margin:0}main{max-width:850px;margin:30px auto;padding:20px}header,.panel{background:white;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 3px 15px #dce3ed}h1{margin:0 0 10px}h2{color:#174c80}.muted{color:#637184}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button{padding:12px 18px;border:1px solid #bad0e5;border-radius:9px;background:#fff;cursor:pointer;font-weight:bold}.tabs button.active,.primary{background:#1768aa;color:white;border-color:#1768aa}.question{padding:17px 0;border-bottom:1px solid #e2e9f0}.question strong{display:block;margin-bottom:10px}.option{display:block;padding:8px 10px;margin:5px 0;border-radius:7px;cursor:pointer}.option:hover{background:#eff5fb}.option input{margin-right:10px}input[type=text]{padding:12px;border:1px solid #b8c8d8;border-radius:8px;width:min(95%,400px);font-size:16px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.hidden{display:none}.ok{color:#087f55}.bad{color:#b82d36}.result{font-size:26px;font-weight:bold}#progress{height:9px;background:#e4ebf2;border-radius:10px;overflow:hidden}#bar{height:100%;width:0;background:#1768aa}small{color:#637184}</style></head><body><main><header><h1>Дигитална лаборатория</h1><p>Интерактивен тест по информационни технологии – 8. и 9. клас</p><p class="muted">30 въпроса · 3 кръга · 40–45 минути · автоматична проверка</p><label>Име и фамилия: <input id="student" type="text" placeholder="Въведи име и фамилия" required></label><p><label>Клас: <input id="klass" type="text" placeholder="Напр. 9А" required></label></p><p class="muted"><small>При завършване резултатът се изпраща към таблицата на преподавателя. Въведи правилно името и класа си.</small></p><p id="count">Отговорени: 0 от 30</p><div id="progress"><div id="bar"></div></div></header><section class="panel" id="exam"><div class="tabs" id="tabs"></div><h2 id="heading"></h2><p class="muted" id="subtitle"></p><div id="questions"></div><div class="actions"><button id="prev">← Назад</button><button id="next" class="primary">Следващ кръг →</button></div><p id="notice" class="bad"></p></section><section class="panel hidden" id="results"></section></main><script>
const rounds=[{name:'Кръг 1 – Какво знам?',desc:'Основни знания по ИТ',items:[
['Коя памет съхранява временно данните на работещите програми?',['RAM','ROM','SSD','Флаш памет'],0,'RAM е оперативната памет.'],
['Кое устройство свързва компютрите в локална мрежа и препраща кадри към съответните портове?',['Модем','Комутатор','Принтер','Скенер'],1,'Комутаторът свързва устройствата в локална мрежа.'],
['Коя програма е операционна система?',['Excel','Photoshop','Linux','PowerPoint'],2,'Linux е операционна система.'],
['Какво означава LAN?',['Глобална мрежа','Локална мрежа','Безжичен протокол','Интернет адрес'],1,'LAN означава Local Area Network.'],
['Коя формула изчислява средноаритметичната стойност на A1:A10?',['=SUM(A1:A10)','=COUNT(A1:A10)','=MAX(A1:A10)','=AVERAGE(A1:A10)'],3,'AVERAGE изчислява средноаритметична стойност.'],
['Кой файлов формат обикновено запазва прозрачност при растерни изображения?',['JPEG','PNG','BMP','TXT'],1,'PNG поддържа прозрачност.'],
['Какво е IP адрес?',['Идентификатор за мрежова комуникация','Вид процесор','Графичен формат','Програма за архивиране'],0,'IP адресът служи за адресиране в IP мрежи.'],
['Коя функция в Excel проверява условие и връща различни резултати?',['SUM','COUNT','IF','ROUND'],2,'IF избира резултат според условието.'],
['Кой елемент най-често съдържа преход към друга уеб страница?',['Хипервръзка','Колонтитул','Пиксел','Слой'],0,'Хипервръзката води към друг ресурс.'],
['Кое е основното предназначение на резервното копие?',['Ускоряване на процесора','Намаляване на екрана','Промяна на файлов формат','Възстановяване на данни'],3,'Резервното копие позволява възстановяване при загуба на данни.']]},
{name:'Кръг 2 – Открий грешката',desc:'Разпознай неверното твърдение',items:[
['Кое твърдение за RAM е грешно?',['Съхранява временни данни','Изтрива съдържанието си без захранване','Запазва файловете трайно','Използва се от работещите програми'],2,'RAM е енергозависима памет, а не трайно хранилище.'],
['Коя формула е грешна, ако трябва да сумираме A1:A5?',['=SUM(A1:A5)','=A1+A2+A3+A4+A5','=SUM(A1;A2;A3;A4;A5)','=AVERAGE(A1:A5)'],3,'AVERAGE изчислява средна стойност, не сума.'],
['Кое твърдение за HTTPS е грешно?',['Използва криптирана връзка','Гарантира, че сайтът е честен','Използва TLS','Може да се използва за уеб страници'],1,'HTTPS защитава връзката, но не гарантира надеждността на сайта.'],
['Кое твърдение за изображенията е грешно?',['SVG е векторен формат','JPEG е растерен формат','PNG е растерен формат','JPEG винаги запазва прозрачност'],3,'JPEG не поддържа прозрачност.'],
['Кое твърдение за Excel е грешно?',['$A$1 е абсолютен адрес','A1 е относителен адрес','$A1 фиксира реда','A$1 фиксира реда'],2,'$A1 фиксира колоната, не реда.'],
['Кое действие е грешка при работа с пароли?',['Използване на уникални пароли','Включване на двуфакторна защита','Споделяне на парола с приятел','Използване на мениджър на пароли'],2,'Паролите не трябва да се споделят.'],
['Кое твърдение за презентациите е грешно?',['Контрастът подобрява четимостта','Всеки слайд трябва да е изпълнен с дълги абзаци','Единният стил улеснява възприемането','Изображенията трябва да са подходящи'],1,'Прекомерният текст затруднява възприемането.'],
['Кое твърдение за компютърните мрежи е грешно?',['Маршрутизаторът свързва мрежи','Комутаторът свързва устройства в LAN','Wi-Fi използва радиовълни','DNS увеличава физически RAM паметта'],3,'DNS преобразува имена на домейни в адреси.'],
['Кое твърдение за файловете е грешно?',['Разширението може да подсказва формата','Преименуването на .jpg в .png преобразува изображението','Файловете имат имена','Форматът определя начина на запис на данните'],1,'Смяната на разширението не преобразува съдържанието.'],
['Кое твърдение за авторските права е грешно?',['Лицензът може да задава условия','Авторът има права върху произведението','Посочването на автор не винаги е достатъчно','Всички снимки от интернет могат свободно да се използват'],3,'Публикуването онлайн не премахва авторските права.']]},
{name:'Кръг 3 – Реши дигиталния проблем',desc:'Практически ситуации и логическо мислене',items:[
['Имаш 500 продажби и искаш общ приход по градове. Какво ще използваш?',['Обобщаваща таблица','Проверка на правописа','Преходи между слайдове','Мениджър на шрифтове'],0,'PivotTable групира и обобщава данни.'],
['В Excel B2=75. Какъв е резултатът от =IF(AND(B2>=50;B2<80);"Да";"Не")?',['Не','75','Да','TRUE'],2,'75 изпълнява и двете условия.'],
['Получаваш съмнителен линк за вход в училищен профил. Какво правиш?',['Въвеждаш паролата','Проверяваш през официалния сайт','Препращаш линка','Изключваш антивирусната програма'],1,'Независимата проверка предпазва от фишинг.'],
['Копираш =B2*$F$1 от D2 в D3. Каква става формулата?',['=B3*$F$1','=B2*$F$2','=B3*F2','=B2*$F$1'],0,'Относителният адрес се измества, абсолютният остава.'],
['Трябва да намериш цена по продуктов код в първата колона на таблица. Коя функция е подходяща?',['PMT','COUNT','HLOOKUP','VLOOKUP'],3,'VLOOKUP търси по първата колона на зададен диапазон.'],
['Искаш да сравниш три варианта на месечен бюджет чрез промяна на няколко входни стойности. Кой инструмент избираш?',['Сценарио мениджър','Проверка на данни','Условно форматиране','Замразяване на панели'],0,'Сценарио мениджърът сравнява набори от входни стойности.'],
['Компютърът няма достъп до интернет, но другите в кабинета имат. Какво проверяваш първо?',['Сменяш процесора','Преинсталираш всичко','Проверяваш мрежовата връзка','Изтриваш документите'],2,'Първо се проверява локалната връзка и мрежовата конфигурация.'],
['Увеличаваш малко растерно лого и то се размазва. Кое решение е най-подходящо?',['Намаляваш RAM','Използваш векторна версия','Преименуваш файла','Добавяш анимация'],1,'Векторната графика може да се мащабира без пикселизиране.'],
['Трябва да изчислиш месечна вноска по кредит при известни лихва, брой периоди и сума. Коя функция използваш?',['COUNTIF','VLOOKUP','PMT','MAX'],2,'PMT изчислява периодична вноска при постоянна лихва и равни плащания.'],
['Клубът прави сайт. Коя е най-разумната последователност?',['Публикуване, дизайн, планиране','Дизайн, публикуване, проверка','Изграждане, публикуване, планиране','Планиране, дизайн, изграждане, тестване, публикуване'],3,'Тестването трябва да предхожда публикуването.']]}];
let round=0;const answers={};const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){el('tabs').innerHTML=rounds.map((r,i)=>`<button class="${round===i?'active':''}" onclick="go(${i})">Кръг ${i+1} (${r.items.filter((q,j)=>answers[i+'-'+j]!==undefined).length}/10)</button>`).join('');el('heading').textContent=rounds[round].name;el('subtitle').textContent=rounds[round].desc;el('questions').innerHTML=rounds[round].items.map((q,j)=>`<div class="question"><strong>${round*10+j+1}. ${esc(q[0])}</strong>${q[1].map((a,k)=>`<label class="option"><input type="radio" name="q${round}-${j}" value="${k}" ${answers[round+'-'+j]===k?'checked':''} onchange="choose(${round},${j},${k})">${'АБВГ'[k]}. ${esc(a)}</label>`).join('')}</div>`).join('');el('prev').disabled=round===0;el('next').textContent=round===2?'Завърши теста':'Следващ кръг →';const n=Object.keys(answers).length;el('count').textContent=`Отговорени: ${n} от 30`;el('bar').style.width=n/30*100+'%';el('notice').textContent='';}function choose(r,j,k){answers[r+'-'+j]=k;render()}function go(i){round=i;render();window.scrollTo(0,0)}el('prev').onclick=()=>go(round-1);el('next').onclick=()=>{if(round<2){go(round+1);return}if(!el('student').value.trim() || !el('klass').value.trim()){el('notice').textContent='Попълни име и фамилия и клас.';return}if(Object.keys(answers).length!==30){el('notice').textContent='Отговори на всички 30 въпроса, преди да завършиш.';return}finish()};
function finish(){let correct=0;let details='';let parts=[];rounds.forEach((r,i)=>{let s=0;r.items.forEach((q,j)=>{const a=answers[i+'-'+j],ok=a===q[2];if(ok){s++;correct++}details+=`<div class="question"><strong class="${ok?'ok':'bad'}">${i*10+j+1}. ${esc(q[0])} — ${ok?'Вярно':'Грешно'}</strong><p>Твоят отговор: ${esc(q[1][a])}</p>${ok?'':`<p class="ok">Верен отговор: ${esc(q[1][q[2]])}</p>`}<small>${esc(q[3])}</small></div>`});parts.push(s)});let grade=correct>=27?6:correct>=23?5:correct>=18?4:correct>=15?3:2;let name=el('student').value.trim();let klass=el('klass').value.trim();el('exam').classList.add('hidden');el('results').classList.remove('hidden');el('results').innerHTML=`<h2>Резултат от теста</h2><p><b>${esc(name)}</b> · ${esc(klass)}</p><p id="sendStatus" class="muted">Изпращане на резултата...</p><p class="result">${correct}/30 точки (${Math.round(correct/30*100)}%)</p><h3>Оценка: ${grade}</h3><p>Кръг 1: ${parts[0]}/10 · Кръг 2: ${parts[1]}/10 · Кръг 3: ${parts[2]}/10</p><button class="primary" id="print">Разпечатай резултата</button> <button id="review">Покажи отговорите</button> <button id="restart">Нов опит</button><div id="detail" class="hidden">${details}</div><p><small>Скала: 27–30 Отличен (6); 23–26 Много добър (5); 18–22 Добър (4); 15–17 Среден (3); 0–14 Слаб (2).</small></p>`;el('print').onclick=()=>window.print();el('review').onclick=()=>{el('detail').classList.toggle('hidden');el('review').textContent=el('detail').classList.contains('hidden')?'Покажи отговорите':'Скрий отговорите'};el('restart').onclick=()=>location.reload();sendResult(name,klass,correct,grade);window.scrollTo(0,0)}const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyFQUrM1DPy8YVRB9hbV3E0vuPDK_00tXMm6w-agmpm5iMrzP0Yd5ikM9X9mLEgiWDI/exec';
async function sendResult(name,klass,score,grade){
 const status=el('sendStatus');
 try {
   // Apps Script does not expose a cross-origin response to static GitHub Pages.
   // no-cors permits sending but cannot confirm spreadsheet insertion.
   await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name,klass,score,grade})});
   status.textContent='Резултатът е изпратен. Преподавателят ще провери записа в таблицата.';
 } catch(err) {
   status.textContent='Неуспешно изпращане. Покажи или запази резултата и уведоми преподавателя.';
   status.className='bad';
 }
}
render();
</script></body></html>
